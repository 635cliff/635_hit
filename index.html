<style>

table{

<body>
<header>
<h1>635 大肚溪聯賽｜打擊總統計</h1>
<div class="sub" id="date">資料載入中...</div>
</header>

<div class="wrap">
<div class="tools">
<input id="search" type="search" placeholder="搜尋姓名">
<button id="reload" type="button">重新載入資料</button>
<button id="playerOnlyBtn" type="button">只看球員資料</button>
</div>

<div class="rangeBox">
  <div class="rangeTitle">統計場次範圍：<strong id="rangeLabel">第 1 場 ～ 第 1 場</strong></div>
  <div class="rangeRow">
    <span>起始</span>
    <input id="rangeStart" type="range" min="1" max="1" value="1" step="1">
    <strong id="startValue">1</strong>
  </div>
  <div class="rangeRow">
    <span>結束</span>
    <input id="rangeEnd" type="range" min="1" max="1" value="1" step="1">
    <strong id="endValue">1</strong>
  </div>
  <div class="rangeHint">依 games.csv 的紀錄順序計算，第 1 場就是 CSV 最早的一場。</div>
</div>

<div id="cards" class="cards"></div>
<div id="status" class="status"></div>
<div id="error"></div>

<div class="opponentBox">
  <button id="opponentBtn" type="button">對手戰績</button>
  <div id="opponentPanel" class="opponentPanel"></div>
</div>

<div class="tablebox">
<table id="stats">
<thead></thead>
<tbody></tbody>
</table>
</div>
</div>

<script>
"use strict";
// 欄位順序固定：NO、姓名、出席、出席率、上壘率、打點、打擊率、上壘、打數、一壘1、二壘2、三壘3、全壘打4、保送B、三振K、雙殺D、接殺出局F、其他出局O


const GAME_FILE = "games.csv";

const COLUMNS = [
 ["no","NO"],["name","姓名"],["games","出席"],["rate","出席率"],
 ["obp","上壘率"],["stars","打點"],["avg","打擊率"],["onbase","上壘"],["ab","打數"],
 ["s1","一壘1"],["s2","二壘2"],["s3","三壘3"],["hr","全壘打4"],
 ["bb","保送B"],["k","三振K"],["d","雙殺D"],["f","接殺出局F"],["o","其他出局O"]
];

let players = [];
let totals = [];
let games = [];
let playerMap = new Map();
let sortKey = "no";
let sortDir = 1;
let rangeStart = 1;
let rangeEnd = 1;

function decodeCSV(bytes){
  const hasUtf8Bom = bytes.length >= 3 &&
    bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF;

  if(hasUtf8Bom){
    return new TextDecoder("utf-8").decode(bytes);
  }

  // 台灣 Excel 匯出的 CSV 常見 Big5；若內容明顯是 UTF-8，使用 UTF-8。
  const utf8 = new TextDecoder("utf-8", {fatal:false}).decode(bytes);
  if(utf8.includes("�")){
    return new TextDecoder("big5").decode(bytes);
  }
  return utf8;
}

async function getText(url){
  const response = await fetch(url + "?v=" + Date.now(), {cache:"no-store"});
  if(!response.ok){
    throw new Error(url + " 載入失敗：" + response.status);
  }
  return decodeCSV(new Uint8Array(await response.arrayBuffer()));
}

function parseCSV(text){
  text = String(text || "").replace(/^\uFEFF/, "");
  const rows = [];
  let row = [], field = "", quoted = false;

  for(let i=0;i<text.length;i++){
    const ch = text[i];
    const next = text[i+1];

    if(ch === '"'){
      if(quoted && next === '"'){
        field += '"';
        i++;
      }else{
        quoted = !quoted;
      }
    }else if(ch === "," && !quoted){
      row.push(field);
      field = "";
    }else if((ch === "\r" || ch === "\n") && !quoted){
      if(ch === "\r" && next === "\n") i++;
      row.push(field);
      if(row.some(v => String(v).trim() !== "")) rows.push(row);
      row = [];
      field = "";
    }else{
      field += ch;
    }
  }

  if(field !== "" || row.length){
    row.push(field);
    if(row.some(v => String(v).trim() !== "")) rows.push(row);
  }
  return rows;
}

function makePlayer(name, no){
  return { no:String(no), name:String(name).trim() };
}

function blankStats(p){
  return {
    no:p.no, name:p.name,
    games:0, ab:0, s1:0, s2:0, s3:0, hr:0,
    bb:0, k:0, d:0, f:0, o:0,
    h:0, onbase:0, stars:0
  };
}

function countResult(stats, raw){
  const result = String(raw || "").trim().toUpperCase();

  for(const ch of result){
    if(ch === "1"){
      stats.ab++; stats.s1++; stats.h++; stats.onbase++;
    }else if(ch === "2"){
      stats.ab++; stats.s2++; stats.h++; stats.onbase++;
    }else if(ch === "3"){
      stats.ab++; stats.s3++; stats.h++; stats.onbase++;
    }else if(ch === "4"){
      stats.ab++; stats.hr++; stats.h++; stats.onbase++;
    }else if(ch === "B"){
      stats.bb++; stats.onbase++;
    }else if(ch === "K"){
      stats.ab++; stats.k++;
    }else if(ch === "D"){
      stats.ab++; stats.d++;
    }else if(ch === "F"){
      stats.ab++; stats.f++;
    }else if(ch === "O"){
      stats.ab++; stats.o++;
    }else if(ch === "*"){
      stats.stars++;
    }
  }
}

function buildGames(rows){
  const result = [];
  let current = null;

  for(const row of rows){
    const a = String(row[0] ?? "").trim();
    const b = String(row[1] ?? "").trim();
    const c = String(row[2] ?? "").trim();
    const name = String(row[3] ?? "").trim();
    const batting = String(row[4] ?? "").trim();

    // 欄位標題列
    if(a === "日期") continue;

    // 新格式：日期,對手,對手得分,球員,打擊狀態
    if(a){
      current = {
        date:a,
        time:"",
        opponent:b,
        score:c,
        records:[]
      };
      result.push(current);
    }

    // 第一筆球員資料在同一列，後續球員資料前三欄為空白
    if(current && name && name !== "球員"){
      current.records.push({name:name, result:batting});
    }
  }

  return result;
}

function calculate(sourceGames = games){
  const map = new Map();
  for(const p of players) map.set(p.name, blankStats(p));

  for(const game of sourceGames){
    const appeared = new Set();

    for(const record of game.records){
      const stats = map.get(record.name);
      if(!stats) continue;

      appeared.add(record.name);
      countResult(stats, record.result);
    }

    for(const name of appeared){
      const stats = map.get(name);
      if(stats) stats.games++;
    }
  }

  return players.map(p => map.get(p.name));
}

function metric(s, key){
  if(key === "rate"){
    const n = Math.max(0, rangeEnd - rangeStart + 1);
    return n ? s.games / n : 0;
  }
  if(key === "avg"){
    return s.ab ? s.h / s.ab : 0;
  }
  if(key === "obp"){
    return (s.ab + s.bb) ? s.onbase / (s.ab + s.bb) : 0;
  }
  return Number(s[key] ?? 0);
}

function percent(v){
  return (Number.isFinite(v) ? v * 100 : 0).toFixed(1) + "%";
}

function average(v){
  return Number.isFinite(v) ? v.toFixed(3).replace(/^0\./,".") : ".000";
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function normalizeOpponent(name){
  return String(name || "").trim().toLowerCase();
}

function gameTeamScore(game){
  return game.records.reduce((sum,r)=>{
    const text=String(r.result || "");
    return sum + (text.match(/\*/g) || []).length;
  },0);
}

function getOpponentStats(){
  const map=new Map();
  const sourceGames = games.slice(rangeStart-1, rangeEnd);
  for(const game of sourceGames){
    const name=String(game.opponent || "").trim() || "未填對手";
    const key=normalizeOpponent(name);
    if(!map.has(key)) map.set(key,{name, games:0, win:0, draw:0, loss:0, teamScore:0, oppScore:0, details:[]});
    const s=map.get(key);
    const team=gameTeamScore(game);
    const opp=Number(game.score || 0);
    s.games++; s.teamScore+=team; s.oppScore+=opp;
    const result=team>opp ? "勝" : team<opp ? "敗" : "和";
    if(result==="勝") s.win++; else if(result==="和") s.draw++; else s.loss++;
    s.details.push({date:game.date, team, opp, result});
  }
  return Array.from(map.values()).sort((a,b)=>b.games-a.games || a.name.localeCompare(b.name));
}

function renderOpponentPanel(){
  const panel=document.getElementById("opponentPanel");
  const list=getOpponentStats();
  panel.innerHTML=`
    <table class="opponentTable">
      <thead><tr><th>對手</th><th>場</th><th>勝</th><th>和</th><th>敗</th><th>635得分</th><th>對手得分</th><th>明細</th></tr></thead>
      <tbody>${list.map((s,i)=>`
        <tr>
          <td>${escapeHTML(s.name)}</td><td>${s.games}</td><td>${s.win}</td><td>${s.draw}</td><td>${s.loss}</td>
          <td>${s.teamScore}</td><td>${s.oppScore}</td>
          <td><button class="detailBtn" data-opp="${escapeHTML(normalizeOpponent(s.name))}">查看</button></td>
        </tr>`).join("")}</tbody>
    </table>`;
  panel.querySelectorAll(".detailBtn").forEach(btn=>{
    btn.onclick=()=>{
      const key=btn.dataset.opp;
      const s=list.find(x=>normalizeOpponent(x.name)===key);
      if(!s) return;
      alert(s.name+"\\n\\n"+s.details.map(d=>`${d.date}　635 ${d.team} : ${d.opp}　${d.result}`).join("\\n"));
    };
  });
}

function getSelectedGames(){
  const start=Math.max(1, Math.min(rangeStart, games.length || 1));
  const end=Math.max(start, Math.min(rangeEnd, games.length || start));
  return games.slice(start-1,end);
}

function updateRangeUI(){
  const n=games.length;
  const rs=document.getElementById("rangeStart");
  const re=document.getElementById("rangeEnd");
  if(!rs || !re) return;
  rs.max=String(Math.max(1,n)); re.max=String(Math.max(1,n));
  rangeStart=Math.max(1,Math.min(rangeStart,Math.max(1,n)));
  rangeEnd=Math.max(rangeStart,Math.min(rangeEnd,Math.max(1,n)));
  rs.value=rangeStart; re.value=rangeEnd;
  document.getElementById("startValue").textContent=rangeStart;
  document.getElementById("endValue").textContent=rangeEnd;
  document.getElementById("rangeLabel").textContent=`第 ${rangeStart} 場 ～ 第 ${rangeEnd} 場`;
}

function render(){
  const selectedGames=getSelectedGames();

  // 依目前場次範圍重新建立球員與統計
  const seen=new Set(), names=[];
  for(const game of selectedGames){
    for(const record of game.records){
      if(record.name && !seen.has(record.name)){
        seen.add(record.name); names.push(record.name);
      }
    }
  }
  players=names.map((name,i)=>makePlayer(name,i+1));
  playerMap=new Map(players.map(p=>[p.name,p]));
  totals=calculate(selectedGames);

  const query = document.getElementById("search").value.trim().toLowerCase();

  let rows = totals.filter(s =>
    !query || s.name.toLowerCase().includes(query)
  );

  rows.sort((a,b)=>{
    const x = metric(a, sortKey);
    const y = metric(b, sortKey);
    if(x < y) return -sortDir;
    if(x > y) return sortDir;
    return Number(a.no || 999999) - Number(b.no || 999999);
  });

  // NO 永遠是目前排序後的 1~35
  rows = rows.slice(0,35);

  document.querySelector("#stats thead").innerHTML =
    "<tr>" +
    COLUMNS.map(([key,label]) =>
      `<th data-key="${key}" class="${
        key === sortKey ? (sortDir === 1 ? "asc" : "desc") : "sort"
      }">${label}</th>`
    ).join("") +
    "</tr>";

  document.querySelector("#stats tbody").innerHTML = rows.map((s,i) => `
    <tr>
      <td>${i+1}</td>
      <td class="name">${escapeHTML(s.name)}</td>
      <td>${s.games}</td>
      <td>${percent(metric(s,"rate"))}</td>
      <td>${percent(metric(s,"obp"))}</td>
      <td>${s.stars}</td>
      <td>${average(metric(s,"avg"))}</td>
      <td>${s.onbase}</td>
      <td>${s.ab}</td>
      <td>${s.s1}</td>
      <td>${s.s2}</td>
      <td>${s.s3}</td>
      <td>${s.hr}</td>
      <td>${s.bb}</td>
      <td>${s.k}</td>
      <td>${s.d}</td>
      <td>${s.f}</td>
      <td>${s.o}</td>
    </tr>
  `).join("");

  document.querySelectorAll("#stats th").forEach(th=>{
    th.onclick=()=>{
      const key=th.dataset.key;
      if(sortKey===key) sortDir*=-1;
      else {sortKey=key; sortDir=-1;}
      render();
    };
  });

  const sum=(key)=>totals.reduce((n,s)=>n+Number(s[key]||0),0);
  const totalAB=sum("ab"), totalH=sum("h"), totalBB=sum("bb"), totalOB=sum("onbase");
  const totalTeamScore=selectedGames.reduce((n,g)=>n+gameTeamScore(g),0);
  const totalOppScore=selectedGames.reduce((n,g)=>n+Number(g.score||0),0);
  let wins=0,draws=0,losses=0;
  selectedGames.forEach(g=>{
    const a=gameTeamScore(g), b=Number(g.score||0);
    if(a>b) wins++; else if(a===b) draws++; else losses++;
  });

  document.getElementById("cards").innerHTML=[
    ["總場次",selectedGames.length],["635總得分",totalTeamScore],["對手總得分",totalOppScore],
    ["勝",wins],["和",draws],["敗",losses],["球員人數",totals.length],
    ["總打數",totalAB],["總安打",totalH],["總上壘",totalOB],
    ["總打擊率",average(totalAB?totalH/totalAB:0)],
    ["總上壘率",percent((totalAB+totalBB)?totalOB/(totalAB+totalBB):0)]
  ].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join("");
}


async function load(){
  const errorBox = document.getElementById("error");
  const statusBox = document.getElementById("status");

  errorBox.innerHTML = "";
  statusBox.textContent = "正在讀取 games.csv...";

  try{
    const gameText = await getText(GAME_FILE);
    const gameRows = parseCSV(gameText);

    games = buildGames(gameRows);

    // 不再需要 players.csv；只統計 games.csv 實際出現過的球員。
    const seen = new Set();
    const names = [];
    for(const game of games){
      for(const record of game.records){
        if(record.name && !seen.has(record.name)){
          seen.add(record.name);
          names.push(record.name);
        }
      }
    }

    players = names.map((name, i) => makePlayer(name, i + 1));

    playerMap = new Map();
    for(const p of players) playerMap.set(p.name, p);

    totals = calculate();

    rangeStart=1;
    rangeEnd=games.length || 1;
    updateRangeUI();
    render();

    document.getElementById("date").textContent =
      `共 ${games.length} 場｜目前統計第 1～${games.length} 場｜球員 ${players.length} 人`;

    statusBox.textContent =
      `已載入 ${games.length} 場比賽。可用下方兩個旋鈕選擇統計場次範圍。點擊欄位標題即可排序。`;

    render();

  }catch(error){
    console.error(error);
    statusBox.textContent = "";
    errorBox.innerHTML =
      `<div class="err">資料載入錯誤：${escapeHTML(error.message)}

請確認：
1. index.html 與 games.csv 在同一層
2. 檔名完全是 games.csv
3. GitHub Pages 已完成部署

如果你剛剛才更新檔案，請按「重新載入資料」或 Ctrl + F5。</div>`;
  }
}

function updateTableStickyTop(){
  const header=document.querySelector("header");
  if(header){
    document.documentElement.style.setProperty(
      "--table-top",
      Math.ceil(header.getBoundingClientRect().height) + "px"
    );
  }
}
window.addEventListener("resize", updateTableStickyTop);
window.addEventListener("load", updateTableStickyTop);

document.getElementById("search").addEventListener("input", render);
function changeRange(which, value){
  const v=Number(value);
  if(which==="start"){
    rangeStart=Math.max(1,Math.min(v,rangeEnd));
  }else{
    rangeEnd=Math.min(games.length,Math.max(v,rangeStart));
  }
  updateRangeUI();
  render();
  document.getElementById("date").textContent =
    `共 ${games.length} 場｜目前統計第 ${rangeStart}～${rangeEnd} 場｜球員 ${totals.length} 人`;
}

document.getElementById("rangeStart").addEventListener("input",e=>changeRange("start",e.target.value));
document.getElementById("rangeEnd").addEventListener("input",e=>changeRange("end",e.target.value));

document.getElementById("playerOnlyBtn").addEventListener("click", ()=>{
  const only=document.body.classList.toggle("playerOnly");
  const btn=document.getElementById("playerOnlyBtn");
  btn.textContent=only ? "顯示完整統計" : "只看球員資料";
  btn.classList.toggle("active", only);
  updateTableStickyTop();
});

document.getElementById("reload").addEventListener("click", load);
document.getElementById("opponentBtn").addEventListener("click", ()=>{
  const p=document.getElementById("opponentPanel");
  p.classList.toggle("show");
  if(p.classList.contains("show")) renderOpponentPanel();
});
load();
</script>
</body>
